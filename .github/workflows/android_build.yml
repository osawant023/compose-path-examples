name: Android Build
on:
   push:
        branches: [ master ]
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle and Enable Caching
        uses: gradle/gradle-build-action@v3

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Run Tests
        run: ./gradlew test

      - name: Build Project
        run : ./gradlew assembleDebug

      - name: Copy APK to root
        run: |
            mkdir -p apk
            cp app/build/outputs/apk/debug/app-debug.apk ./apk/debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
         name: debug-apk
         path: apk/debug.apk

      - name: Commit APK to repo
        run: |
          git config --global user.name "osawant023"
          git config --global user.email "osawant023@gmail.com"
          git add apk/debug.apk
          git commit -m "Add debug APK from CI"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send APK via Email to team
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_APP_PASSWORD }}
          subject: "📦 New Android APK Build"
          body: |
            Hello Team,

            The latest debug APK is attached.
            Please review and test.

            – CI/CD System
          to: ${{ secrets.TO_EMAIL }}
          from: ${{ secrets.EMAIL_USERNAME }}
          attachments: apk/debug.apk
          secure: true
